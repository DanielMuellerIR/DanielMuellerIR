name: README parity

on:
  push:
    paths:
      - README.md
      - README.de.md
      - scripts/**
      - tests/**
      - .github/workflows/readme-parity.yml
  pull_request:
    paths:
      - README.md
      - README.de.md
      - scripts/**
      - tests/**
      - .github/workflows/readme-parity.yml

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Markdown parser
        run: python -m pip install -r scripts/requirements.txt
      - name: Test link comparison
        run: python -m unittest discover -s tests
      - name: Compare GitHub links
        run: python scripts/check_readme_links.py
